name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check, test, build (affected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - run: moon ci --color

  drizzle-drift:
    name: Drizzle schema drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Regenerate migrations
        run: cd apps/api && pnpm db:generate

      - name: Fail on drift
        run: |
          if [ -n "$(git status --porcelain -- 'apps/api/drizzle')" ]; then
            git status --porcelain -- 'apps/api/drizzle'
            echo "::error::Drizzle schema drift detected — run db:generate and commit the migration"
            exit 1
          fi
