name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Wait for CI to be green on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REQUIRED=("Check, test, build (affected)" "E2E (api + web)" "Drizzle schema drift check")
          for attempt in $(seq 1 40); do
            RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" -q '[.check_runs[] | {name, conclusion}]')"
            FAILED="$(printf '%s' "$RUNS" | jq -r '[.[] | select(.name != "Publish GitHub release") | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped")] | length')"
            if [ "$FAILED" != "0" ]; then
              echo "::error::a CI check on ${GITHUB_SHA} did not succeed — release only from green trunk"
              printf '%s\n' "$RUNS"
              exit 1
            fi
            MISSING=0
            for name in "${REQUIRED[@]}"; do
              printf '%s' "$RUNS" | jq -e --arg n "$name" 'any(.[]; .name == $n and .conclusion == "success")' >/dev/null || MISSING=1
            done
            if [ "$MISSING" = "0" ]; then
              echo "all required checks are green on ${GITHUB_SHA}"
              exit 0
            fi
            echo "waiting for CI on ${GITHUB_SHA} (attempt $attempt/40)"
            sleep 30
          done
          echo "::error::CI did not finish on ${GITHUB_SHA} within 20 minutes"
          exit 1

      - name: Build release notes from conventional commits
        run: |
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          RANGE="${PREV:+${PREV}..}${GITHUB_REF_NAME}"
          {
            for section in "feat:Features" "fix:Fixes" "refactor:Refactoring" "ci:CI" "docs:Docs" "test:Tests" "chore:Chores"; do
              prefix="${section%%:*}"
              title="${section#*:}"
              lines="$(git log --no-merges --format='- %s (%h)' "$RANGE" \
                | grep -E "^- ${prefix}(\([^)]*\))?!?: " \
                | sed -E "s/^- ${prefix}\(([^)]*)\)!?: /- \1: /; s/^- ${prefix}!?: /- /")"
              if [ -n "$lines" ]; then
                printf '## %s\n\n%s\n\n' "$title" "$lines"
              fi
            done
            if [ -n "$PREV" ]; then
              printf 'Full changelog: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$PREV" "$GITHUB_REF_NAME"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Standard $GITHUB_REF_NAME" --notes-file release-notes.md --latest
