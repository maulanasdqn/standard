name: Release

on:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether this version is already released
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} is already tagged, nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v${VERSION} has no tag yet, releasing"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for CI to be green on this commit
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REQUIRED=("Check, test, build (affected)" "E2E (api + web)" "Drizzle schema drift check")
          for attempt in $(seq 1 40); do
            RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" -q '[.check_runs[] | {name, conclusion}]')"
            FAILED="$(printf '%s' "$RUNS" | jq -r '[.[] | select(.name != "Release") | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped")] | length')"
            if [ "$FAILED" != "0" ]; then
              echo "::error::a CI check on ${GITHUB_SHA} did not succeed: release only from green trunk"
              printf '%s\n' "$RUNS"
              exit 1
            fi
            MISSING=0
            for name in "${REQUIRED[@]}"; do
              printf '%s' "$RUNS" | jq -e --arg n "$name" 'any(.[]; .name == $n and .conclusion == "success")' >/dev/null || MISSING=1
            done
            if [ "$MISSING" = "0" ]; then
              echo "all required checks are green on ${GITHUB_SHA}"
              exit 0
            fi
            echo "waiting for CI on ${GITHUB_SHA} (attempt $attempt/40)"
            sleep 30
          done
          echo "::error::CI did not finish on ${GITHUB_SHA} within 20 minutes"
          exit 1

      - name: Tag the commit
        if: steps.version.outputs.release == 'true'
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      - name: Build release notes from conventional commits
        if: steps.version.outputs.release == 'true'
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          RANGE="${PREV:+${PREV}..}${TAG}"
          {
            for section in "feat:Features" "fix:Fixes" "refactor:Refactoring" "ci:CI" "docs:Docs" "test:Tests" "chore:Chores"; do
              prefix="${section%%:*}"
              title="${section#*:}"
              lines="$(git log --no-merges --format='- %s (%h)' "$RANGE" \
                | grep -E "^- ${prefix}(\([^)]*\))?!?: " \
                | sed -E "s/^- ${prefix}\(([^)]*)\)!?: /- \1: /; s/^- ${prefix}!?: /- /")"
              if [ -n "$lines" ]; then
                printf '## %s\n\n%s\n\n' "$title" "$lines"
              fi
            done
            if [ -n "$PREV" ]; then
              printf 'Full changelog: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$PREV" "$TAG"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: gh release create "$TAG" --title "Standard $TAG" --notes-file release-notes.md --latest
