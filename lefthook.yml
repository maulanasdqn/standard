commit-msg:
  jobs:
    - name: ste commit message
      run: make -s ste-require && ste check commit {1}

pre-push:
  parallel: true
  jobs:
    - name: biome check
      run: moon run :check

    - name: typecheck + unit tests
      run: moon run :build :test

    - name: ste prose + code
      run: make ste-check
